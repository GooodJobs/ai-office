a{color:inherit}

/* 한 화면: 페이지 전체 스크롤 없음, 칸 안에서만 스크롤 */
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:16px;padding:16px 24px 20px;max-width:1600px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 20px}
.brand{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent)}
.brand .ads{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--ok-soft);color:var(--ok);letter-spacing:0}
.brand .ads.ing{background:var(--warn-soft);color:var(--warn)}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;color:var(--muted);font-weight:600;padding:8px 16px}
.nav button.on{background:var(--cta);color:var(--cta-ink)}
.nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px}
.tright{display:flex;align-items:center;gap:8px;white-space:nowrap}
#live{font-size:12px;color:var(--muted)}
.hello{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 4px}
.hello h1{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:700}
.hello .homelink{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.hello .homelink:hover{color:var(--accent)}
.hello .homelink .go{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 10px;letter-spacing:0}
.hello .homelink:hover .go{background:var(--accent);color:var(--accent-ink)}
.hello .date{color:var(--muted);font-size:13px}
.hello .mid{font-weight:700;font-size:16px}
.team{justify-self:end;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.av{position:relative;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--sub);margin-left:-6px;cursor:default}
.av:first-of-type{margin-left:0}
.av b{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--idle)}
.av b.p-ok{background:var(--ok)} .av b.p-warn{background:var(--warn)} .av b.p-bad{background:var(--bad)}

.view{display:none;min-height:0}
.view.on{display:grid}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-height:0;min-width:0;display:flex;flex-direction:column}
.card > .body{flex:1;min-height:0;overflow:auto;margin:0 -8px;padding:0 8px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex:none}
h2 small{color:var(--muted);font-weight:400;font-size:12px}
h2 .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:0}
.empty{color:var(--muted);font-size:13px;padding:16px 0}

/* 홈 */
#v-home{grid-template-columns:minmax(240px,300px) minmax(0,1fr) minmax(260px,340px);gap:24px}
.left{display:flex;flex-direction:column;gap:16px;min-height:0}
/* 색인 현황 카드 · 카테고리 균형 카드 (가로 막대 공통) */
h2 .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:99px;padding:2px 9px}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:7px 0;border-top:1px solid var(--line)}
.meter:first-of-type{border-top:0;padding-top:0}
.meter .nm{font-weight:700;font-size:13.5px}
.meter .v{text-align:right;font-size:13px;color:var(--sub)}
.meter .v b{font-size:20px;color:var(--ink);letter-spacing:-.02em}
.meter .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--idle-soft);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter .ch{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.meter .ch.up{color:var(--ok)} .meter .ch.dn{color:var(--bad)}
.meter .nt{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.cardnote{font-size:12px;color:var(--muted);margin-top:8px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.kpis span{font-size:12px;font-weight:600;opacity:.75}
.kpis em{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:4px;opacity:.8}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;margin-top:12px}
.spark i{flex:1;background:rgba(0,0,0,.28);border-radius:3px 3px 0 0;min-height:3px}
.spark i.now{background:var(--accent-ink)}
.tasks{display:flex;flex-direction:column;min-height:0}
.tasks > h2{justify-content:center;font-size:16px}
.stack{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:4px 8px 16px;margin:0 -8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.task .th{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.task .th .pill{margin-left:auto}
.task .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0;font-size:13px}
.task .meta span{display:block;color:var(--muted);font-size:12px}
.task .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:12.5px}
.right{display:flex;flex-direction:column;gap:16px;min-height:0}
.cal{flex:none;padding:16px 20px}
.cal h2{margin-bottom:8px}
.cal h2 .tag{margin-left:auto}
.cal .nv{border:0;background:var(--soft);width:24px;height:24px;padding:0;border-radius:50%;font-size:14px;line-height:1;color:var(--sub)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
.cg b{font-weight:600;color:var(--muted);font-size:11px;padding-bottom:2px}
.cg b:first-child{color:var(--bad)}
.cg .d{height:26px;display:grid;place-items:center;border-radius:6px;color:var(--sub);border:1px solid transparent}
.cg .d.pub{background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:help}
.cg .d.sch{border-color:var(--accent);color:var(--accent);font-weight:700;cursor:help}
.cg .d.mk{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);font-weight:700;cursor:help}
.cg .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .cardnote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg.mk{background:var(--warn-soft);border:1px solid var(--warn)}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 4px 0 0;vertical-align:-1px}
.lg.pub{background:var(--accent)} .lg.sch{border:1.5px solid var(--accent);margin-left:6px}
#quick{max-height:138px;overflow-y:auto;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
.quick li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crew{flex:none;padding:16px 20px}
.crew h2{margin-bottom:10px}
.crewgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mate{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.mate .ic{grid-row:span 3;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;position:relative}
.mate .ic b{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card);background:var(--idle)}
.mate .ic b.p-ok{background:var(--ok)} .mate .ic b.p-warn{background:var(--warn)} .mate .ic b.p-bad{background:var(--bad)}
.mate .nm{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;min-width:0}
.mate .nm .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mate .nm .pill{margin-left:auto;flex:none;font-size:10.5px;padding:2px 8px}
.mate .rl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate .rp{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1300px){.crewgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.left,.right{overflow-y:auto;scrollbar-width:thin}
.left > .card,.right > .quick{flex:none}
.right > .feed{flex:1 0 180px}
.quick li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
#idxq{grid-row:1/3}
.iq h3{font-size:12px;color:var(--muted);margin:14px 0 4px;font-weight:600}
.iq li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;min-width:0}
.iq li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.iq li b{flex:none;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 10px}
.iq li:hover b{background:var(--accent);color:var(--accent-ink)}
.iq .plan li{cursor:default;color:var(--muted)} .iq .plan li b,.iq .plan li:hover b{color:var(--muted);background:var(--line)}
.iq li.done span{color:var(--muted);text-decoration:line-through}.iq li.done b{background:var(--ok-soft);color:var(--ok)}
.quick li:first-child{border-top:0}
.quick li:hover b{background:var(--accent);color:var(--accent-ink)}
.quick li:nth-child(-n+3) span{color:var(--accent);font-weight:600}
.quick b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:12px}
.feed{flex:1}
.feed li{display:grid;grid-template-columns:32px 1fr;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.ico{grid-row:span 2;width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.ico svg{width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feed .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .w{color:var(--muted);font-size:11.5px}
ul{list-style:none;margin:0;padding:0}

.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--idle)}
.p-acc{background:var(--accent);color:var(--accent-ink)}

/* 키워드 */
#v-kw{grid-template-columns:minmax(0,1fr)}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none;margin-bottom:12px}
.rhead select{font:inherit;font-size:13px;flex:1;min-width:0;max-width:560px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 14px}
.rmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:12px}
.notice{font-size:13px;border-radius:14px;padding:12px 16px;margin:0 0 16px;background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--soft);color:var(--sub)}
.notice{max-width:80ch}
/* 키보드로 움직일 때 지금 위치가 보이게 (마우스 클릭 때는 안 보임) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* 움직임 줄이기 설정을 켠 사용자는 전환 효과 없이 */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* 인쇄: 버튼·메뉴 숨기고, 칸 안 스크롤을 풀어 전부 찍히게 */
@media print{body{background:#fff}button,select,nav,#toast{display:none!important}
  *{overflow:visible!important;max-height:none!important;box-shadow:none!important}html,body{height:auto!important}
  .card{break-inside:avoid;border:1px solid var(--line)}}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kw{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.kw.rec{border-color:var(--ink)}
.kw.ap{background:var(--soft)}
.kl{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.kl input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
.kt{font-size:15px;font-weight:700;line-height:1.35}
.kn{display:inline-block;min-width:22px;height:22px;line-height:22px;margin-right:6px;border-radius:6px;background:#EFF6FF;color:#2563EB;font-size:12px;text-align:center;vertical-align:1px}
.kbadges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.vol{height:6px;border-radius:99px;background:var(--idle-soft);overflow:hidden;margin:4px 0 6px}
.vol i{display:block;height:100%;background:var(--accent)}
.vf{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.vf.from{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}

/* 색인 현황 한 줄 */
.idx{flex:none;display:flex;align-items:center;gap:20px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:12.5px;overflow-x:auto;white-space:nowrap}
.idx > b{font-size:13px}
.idx .e{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.idx .e i{flex:1;height:8px;border-radius:99px;background:var(--idle-soft);overflow:hidden;min-width:60px}
.idx .e i s{display:block;height:100%;background:var(--accent)}
.idx .e em{font-style:normal;color:var(--muted)}

/* 발행·리모델링·로그 */
#v-pub,#v-rem,#v-log{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13.5px}
.list li:first-child{border-top:0}
.list .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .d{display:block;color:var(--muted);font-size:12px}
.list a{text-decoration:none} .list a:hover{text-decoration:underline}
.gauge{display:flex;align-items:center;gap:24px;margin-bottom:16px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;flex:none;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--idle-soft) 0);display:grid;place-items:center}
.ring::after{content:attr(data-label);width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:24px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;flex:none}
.filters button.on{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.member{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .r{grid-column:1/-1;color:var(--muted);font-size:12.5px}

.tabs{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cta);color:var(--cta-ink);border-radius:99px;padding:10px 18px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:1100px){
  #v-home{grid-template-columns:minmax(220px,280px) minmax(0,1fr);grid-template-rows:auto auto;align-content:start;overflow-y:auto;overflow-x:hidden}
  .right{grid-column:1;grid-row:2} .left{grid-column:1;grid-row:1} .tasks{grid-column:2;grid-row:1/3}
  #v-home .stack{overflow:visible} #v-home .card,#v-home .left,#v-home .right{flex:none;min-height:auto} #v-home .card > .body{overflow:visible}
  .hello .mid{display:none} .hello{grid-template-columns:1fr auto}
}
@media (max-width:760px){
  .app{padding:12px 12px 0;gap:12px;grid-template-rows:auto auto minmax(0,1fr) auto}
  .brand .ads{display:none}
  .nav,#live,.team span{display:none}
  .top{padding:6px 6px 6px 16px}
  .hello h1{font-size:22px}
  .view.on{display:flex;flex-direction:column;gap:12px;overflow:auto;margin:0 -12px;padding:0 12px 12px}
  .view.on > *,.left,.right,.tasks,.card{flex:none;min-height:auto}
  #v-home .tasks{order:-1} .stack{overflow:visible;flex:none}
  .card > .body{overflow:visible}
  .hello .date span{display:none}
  .tabs{display:flex;justify-content:space-around;background:var(--card);margin:0 -12px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .tabs button{border:0;background:none;color:var(--muted);padding:6px 4px;font-size:12px;font-weight:600}
  .tabs button.on{color:var(--ink)}
  .task .meta{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i>k-keyword 오피스<span class="ads" id="ads"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="tright"><span id="live"></span><button onclick="location.reload()" title="새로고침">새로고침</button></div>
  </header>

  <div class="hello">
    <div><h1><a class="homelink" href="https://k-keyword.com/" target="_blank" rel="noopener" title="블로그 홈 화면을 새 창으로 열어요">k-keyword.com<span class="go">블로그 열기</span></a></h1><div class="date" id="date"></div></div>
    <div class="mid" id="mid">오늘 할 일</div>
    <div class="team" id="team"></div>
  </div>

  <main id="views" style="min-height:0;display:grid">
    <section class="view" id="v-home" data-name="대시보드">
      <div class="left">
        <div class="card" id="ixcard"></div>
        <div class="card" id="catcard"></div>
      </div>
      <div class="tasks"><div class="stack" id="stack"></div>
        <div class="card crew"><h2>부서 현황<span class="tag" id="crewtag">PC에서 실시간으로 보여요</span></h2><div class="crewgrid" id="crew"></div></div></div>
      <div class="right">
        <div class="card cal" id="cal"></div>
        <div class="card quick"><h2>빠른 요청 <small>누르면 복사돼요 · 아래로 더 있어요</small></h2><ul id="quick"></ul></div>
        <div class="card feed"><h2>최근 활동<button class="more" data-go="v-log">전체 ›</button></h2><div class="body"><ul id="feed"></ul></div></div>
      </div>
    </section>

    <section class="view" id="v-kw" data-name="키워드">
      <div class="card">
        <h2>키워드 발굴 결과 <small>체크 → 승인 저장 · 지난 결과는 삭제할 수 있어요</small></h2>
        <div class="rhead"><select id="rsel" aria-label="발굴 결과 선택"></select><span id="rtools"></span></div>
        <div class="body" id="research"></div>
        <div class="idx" id="idx"></div>
      </div>
    </section>

    <section class="view" id="v-pub" data-name="발행">
      <div class="card" id="idxq"></div>
      <div class="card"><h2>예약·발행 목록</h2><div class="body"><ul class="list" id="sched"></ul></div></div>
      <div class="card"><h2>키워드 대기열</h2><div class="body"><ul class="list" id="queue"></ul></div></div>
    </section>

    <section class="view" id="v-rem" data-name="리모델링">
      <div class="card">
        <h2>애드센스 리모델링 진행률</h2>

const ICON = {
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', doc: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>', dot: '<circle cx="12" cy="12" r="4"/>'
};
const icoOf = t => /승인|합격|완료/.test(t) ? 'check' : /반려|중단|오류/.test(t) ? 'x' : /검수|검증/.test(t) ? 'eye' : /삭제/.test(t) ? 'trash' : /보고|기록/.test(t) ? 'doc' : 'dot';
const feedItem = l => `<li><span class="ico"><svg viewBox="0 0 24 24">${ICON[icoOf(l.type)]}</svg></span>
  <span class="m" title="${esc(l.message)}">${esc(l.message)}</span><span class="w">${esc(l.time)} · ${esc(l.actor)} · ${esc(l.type)}${l.loop ? ` · 루프 ${esc(l.loop)}/3` : ''}</span></li>`;
$('feed').innerHTML = L.slice(0, 12).map(feedItem).join('') || '<li class="empty">기록이 없어요.</li>';
$('logs').innerHTML = L.map(feedItem).join('') || '<li class="empty">기록이 없어요.</li>';
$('members').innerHTML = T.map(m => `<div class="member"><b>${esc(m.name)} <small style="color:var(--muted);font-weight:400">${esc(m.model)} · ${esc(m.role)}</small></b>${pill(m.status || '대기')}
  <span class="r">${esc(m.last_report || '보고 없음')} ${m.report_at ? '· ' + esc(m.report_at) : ''}</span></div>`).join('');

// ---- 발행
$('sched').innerHTML = S.length ? S.map(s => { const u = safeUrl(s.link);
  return `<li><span class="t">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}<span class="d">${esc(s.date)} · ${Number(s.chars || 0).toLocaleString()}자 · ${esc(s.images)}장</span></span>${pill(parse(s.date) > now ? '예약' : '발행완료')}</li>`; }).join('')
  : '<li class="empty">예약된 글이 없어요. 키워드를 승인하면 글 작성이 시작돼요.</li>';
$('queue').innerHTML = Q.length ? Q.map(q => `<li><span class="t">${esc(q.keyword)}</span>${pill(q.status)}</li>`).join('') : '<li class="empty">선택된 키워드가 없어요. 키워드 탭에서 승인하면 여기에 쌓여요.</li>';

// ---- 리모델링
const REM = ['미완료', '검수중', '완료'];
const cnt = st => R.filter(p => p.status === st).length;
const ring = $('ring'); ring.style.setProperty('--p', pct); ring.dataset.label = pct + '%';
$('rlegend').innerHTML = REM.map(k => `<div style="margin:4px 0">${pill(k)} ${cnt(k)}편</div>`).join('');
let rf = '전체';
function drawR(){
  $('rfilters').innerHTML = ['전체', ...REM].map(f => `<button class="${f === rf ? 'on' : ''}" data-f="${f}">${f}</button>`).join('');
  const rows = R.filter(p => rf === '전체' || p.status === rf);
  $('rlist').innerHTML = rows.length ? rows.map(p => { const u = safeUrl(p.url);
    return `<li><span class="t">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</span>${pill(p.status)}</li>`; }).join('')
    : '<li class="empty">글이 없어요.</li>';
}
$('rfilters').addEventListener('click', e => { if (e.target.dataset.f){ rf = e.target.dataset.f; drawR(); } });
drawR();

// ---- 키워드 발굴 결과 (체크·승인 저장은 내 PC 승인 서버 화면에서만)
const canEdit = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let dirty = false, ri = Math.max(0, RS.findIndex(r => r.status === '승인대기'));
function vfText(v){
  if (!v) return '';
  if (v.error) return `검증: ${v.error}`;
  const t = Number(v.total || 0);
  const parts = [t <= 10 ? '월 검색 10 미만' : `월 검색 ${t.toLocaleString()} (PC ${Number(v.pc || 0).toLocaleString()} · 모바일 ${Number(v.mobile || 0).toLocaleString()})`];
  if (v.docs != null) parts.push(`블로그 문서 ${Number(v.docs).toLocaleString()}`);
  if (v.comp) parts.push(`광고경쟁 ${v.comp}`);
  return parts.join(' · ');
}
const fromTotal = n => n == null ? '' : (n <= 10 ? ' (월 검색 10 미만)' : ` (월 검색 ${Number(n).toLocaleString()})`);
function drawResearch(){
  if (!RS.length){ $('rsel').style.display = 'none'; $('research').innerHTML = '<div class="empty">아직 발굴 결과가 없어요. 채팅에 "○○ 키워드 뽑아줘"라고 보내면 시작돼요.</div>'; return; }
  $('rsel').innerHTML = RS.map((r, i) => `<option value="${i}" ${i === ri ? 'selected' : ''}>${r.status === '승인대기' ? '● 승인대기 · ' : ''}${esc(r.kind)} · ${esc(r.seed)} · ${esc(r.time)}</option>`).join('');
  $('rtools').innerHTML = canEdit ? '<button class="del" id="delr">이 결과 삭제</button>' : '';
  const r = RS[ri], kws = r.keywords || [], isDisc = r.kind === '발굴';
  const nApproved = kws.filter(k => k.approved).length;
  const maxV = Math.max(1, ...kws.map(k => Number(k.verify && k.verify.total || 0)));
  let note = '';
  if (isDisc && r.status === '승인대기')
    note = canEdit ? '<div class="notice">검증·중복 검사·짧은 표현 변환까지 마친 키워드예요. <b>★ 팀장 추천</b>을 참고해서 쓸 키워드를 체크하고 <b>승인 저장</b>을 눌러 주세요. 저장 전에는 새 키워드 발굴이 멈춰 있어요.</div>'
                   : '<div class="notice">승인 대기 중 · 폰에서는 <b>채팅으로 승인</b>할 수 있어요. 키워드 앞 번호를 보고 Claude 채팅에 <b>"3·5·7번 승인"</b>처럼 보내 주세요. (모두 안 쓰려면 "승인 없음")</div>';
  else if (isDisc) note = `<div class="notice info">검토 완료 (${esc(r.reviewed_at || '')}) · 승인 ${nApproved}개 → 글 작성 단계로 넘어가요.</div>`;
  $('research').innerHTML = `
    <div class="rmeta"><span>${esc(r.time)}</span><span>${kws.length}개</span>${isDisc ? pill(r.status) : ''}<span>파일: ${esc(r.file)}</span>
      <button id="copykw">${isDisc && nApproved ? '승인 키워드 복사' : '키워드 전체 복사'}</button>
      ${isDisc && canEdit ? '<button id="selall">전체 선택/해제</button><button id="saveap" class="cta">승인 저장</button>' : ''}</div>
    ${note}
    <div class="kwgrid">${kws.map((k, j) => `<div class="kw ${k.approved ? 'ap' : ''} ${k.recommend ? 'rec' : ''}">
        <label class="kl">${isDisc ? `<input type="checkbox" data-j="${j}" ${k.approved ? 'checked' : ''} ${canEdit ? '' : 'disabled'}>` : ''}<span class="kt"><span class="kn">${j + 1}</span>${esc(k.keyword)}</span></label>
        <div class="kbadges">${k.recommend ? '<span class="pill p-acc">★ 팀장 추천</span>' : ''}${k.verify && k.verify.grade ? pill(k.verify.grade) : (k.tag ? `<span class="pill p-idle">${esc(k.tag)}</span>` : '')}${k.dup === true ? '<span class="pill p-bad">중복 의심</span>' : (k.dup === false ? '<span class="pill p-idle">중복 없음</span>' : '')}</div>
        ${k.verify && !k.verify.error ? `<div class="vol" title="월 검색량 비교"><i style="width:${Math.max(2, Number(k.verify.total || 0) / maxV * 100)}%"></i></div>` : ''}
        <div class="vf">${esc(vfText(k.verify))}</div>
        ${k.from ? `<div class="vf from">긴 표현 "${esc(k.from)}"${fromTotal(k.from_total)} → 실제 검색하는 짧은 표현으로 변경</div>` : ''}</div>`).join('')}</div>`;
  const boxes = () => [...$('research').querySelectorAll('input[type=checkbox]')];
  $('copykw').onclick = () => copyText((isDisc && nApproved ? kws.filter(k => k.approved) : kws).map(k => k.keyword).join('\n'));
  if (canEdit) $('delr').onclick = async e => {
    const msg = r.status === '승인대기' ? '아직 승인하지 않은 결과예요. 삭제하면 이 키워드들은 승인 없이 정리돼요. 삭제할까요?'
                                       : `'${r.seed}' 결과를 대시보드에서 지울까요? (키워드는 다음 발굴 때 중복 제안하지 않도록 팀장 기록에 남아요)`;
    if (!confirm(msg)) return;
    e.target.disabled = true;
    try {
      const res = await fetch('/api/research/delete', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: r.id})}).then(x => x.json());
      if (!res.ok) throw new Error(res.error || '삭제 실패');
      location.replace('/?t=' + Date.now() + '#v-kw');
    } catch (err) { alert('삭제하지 못했어요. 승인 서버(open_dashboard.bat)가 켜져 있는지 확인하고 다시 눌러 주세요.\n(원인: ' + err.message + ')'); e.target.disabled = false; }
  };
  if (isDisc && canEdit){
    $('research').onchange = () => { dirty = true; };
    $('selall').onclick = () => { const b = boxes(), all = b.every(x => x.checked); b.forEach(x => x.checked = !all); dirty = true; };
    $('saveap').onclick = async e => {
      const approved = boxes().filter(x => x.checked).map(x => kws[+x.dataset.j].keyword);
      if (!approved.length && !confirm('체크한 키워드가 없어요. 이대로 검토 완료(모두 미승인) 처리할까요?')) return;
      e.target.disabled = true; e.target.textContent = '저장 중…';
      try {
        const res = await fetch('/api/approve', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: r.id, approved})}).then(x => x.json());
        if (!res.ok) throw new Error(res.error || '저장 실패');
        dirty = false; e.target.textContent = `저장됨 (${res.approved}개)`;
        setTimeout(() => location.replace('/?t=' + Date.now() + '#v-kw'), 1200);
      } catch (err) { alert('저장하지 못했어요. 승인 서버(open_dashboard.bat)가 켜져 있는지 확인하고 다시 눌러 주세요. 체크한 내용은 그대로 남아 있어요.\n(원인: ' + err.message + ')'); e.target.disabled = false; e.target.textContent = '승인 저장'; }
    };
  }
}
$('rsel').addEventListener('change', e => { ri = +e.target.value; drawResearch(); });

// ---- 색인 현황 한 줄 (구글·네이버·빙)
const latest = lastAt;
$('idx').innerHTML = `<b title="${esc(latest ? '확인 ' + latest : '')}">색인 현황</b>` + [['google', '구글'], ['naver', '네이버'], ['bing', '빙']].map(([k, name]) => {
  const x = IX[k] || {}, ok = x.indexed != null && x.total;
  const p = ok ? Math.round(x.indexed / x.total * 100) : 0;
  return `<span class="e" title="${esc(x.note || '')} ${esc(x.at || '')}">${name} <i><s style="width:${p}%"></s></i>${ok ? `<b>${p}%</b><em>${x.indexed}/${x.total}</em>` : `<em>${esc(x.note || '확인 전')}</em>`}</span>`;
}).join('');
drawResearch();

// ---- 최근 이미지 한 줄

// ---- 실시간 갱신 (30초마다, 화면을 보고 있을 때만 / 체크 저장 전에는 멈춤)
const online = /^https?:$/.test(location.protocol);
let left = 30;
async function checkNew(){
  try {
    const t = await (await fetch(location.pathname + '?t=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
    if (m && JSON.parse(m[1]).updated_at !== D.updated_at) location.replace(location.pathname + '?t=' + Date.now() + location.hash);
  } catch (e) {}
}
setInterval(() => {
  if (document.hidden) return;
  if (dirty){ $('live').textContent = '체크 저장 전 · 자동 갱신 멈춤'; return; }
  left -= 1;
  $('live').textContent = `실시간 확인 ${left}초`;
  if (left <= 0){ left = 30; online ? checkNew() : location.reload(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && online) checkNew(); });
</script>
</body>
</html>
