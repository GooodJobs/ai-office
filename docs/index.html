<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>k-keyword AI 오피스</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
  --accent:#3b5bdb; --accent-soft:#e7ecff;
  --ok:#1f8a4c; --ok-soft:#e3f5ea; --warn:#b26a00; --warn-soft:#fff3df; --bad:#c0362c; --bad-soft:#fde8e6;
  --idle:#667085; --idle-soft:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --card:#171b21; --ink:#e7eaee; --muted:#98a2b3; --line:#2a3039;
    --accent:#8ea2ff; --accent-soft:#1f2747;
    --ok:#5cc98a; --ok-soft:#14301f; --warn:#f0b357; --warn-soft:#33270f; --bad:#f2837a; --bad-soft:#3a1916;
    --idle:#98a2b3; --idle-soft:#232831; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:7px 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
section{margin-bottom:18px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.member{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.member.lead{border-color:var(--accent);background:linear-gradient(0deg,var(--card),var(--card)),var(--accent-soft)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mname{font-weight:700}
.model{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.role{font-size:12.5px;color:var(--muted)}
.report{font-size:13px;background:var(--bg);border-radius:8px;padding:8px;min-height:44px;word-break:break-word}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--idle)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{padding:16px}
.gauge{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.ring{--p:0;width:108px;height:108px;border-radius:50%;flex:none;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--idle-soft) 0);display:grid;place-items:center}
.ring::after{content:attr(data-label);width:80px;height:80px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--idle-soft);overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.list{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:13.5px}
.list li:first-child{border-top:0}
.list .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list a{color:inherit;text-decoration:none} .list a:hover{text-decoration:underline}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12.5px;border-top:0}
td.num{font-variant-numeric:tabular-nums;text-align:right} th.num{text-align:right}
.logs{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.logs li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 2px;border-top:1px solid var(--line);font-size:13.5px}
.logs li:first-child{border-top:0}
.logs .when{grid-column:1/-1;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:14px 2px}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px;margin:8px 0 12px}
.kw{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.kw .kl{display:flex;gap:8px;align-items:flex-start;min-width:0;word-break:keep-all;cursor:pointer}
.kw input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.kw .vf{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kw.ap .kl > span{font-weight:600}
.notice{font-size:13px;border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.rmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:8px 0 16px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--idle-soft);display:block}
.gallery figcaption{font-size:12px;color:var(--muted);margin-top:4px}
#live{font-size:12px;color:var(--muted)}
@media (max-width:1000px){.team{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
  table.resp td{border:0;padding:0;text-align:left}
  table.resp td.c-title{grid-column:1/-1;font-weight:600}
  table.resp td.num{text-align:left;color:var(--muted);font-size:12.5px}
  table.resp td.num::before{content:attr(data-k) " "}
}
@media (max-width:420px){.team{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>k-keyword AI 오피스</h1>
      <div class="sub">팀장 중심 1인 보고 체계 · 마지막 갱신 <span id="updated"></span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center"><span id="live"></span><button onclick="location.reload()">새로고침</button></div>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>팀 현황 <small>팀원 보고 → 팀장 재검수 → 사용자 결재</small></h2>
    <div class="team" id="team"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>애드센스 리모델링 진행률</h2>
      <div class="gauge">
        <div class="ring" id="ring" data-label="0%"></div>
        <div class="legend" id="rlegend"></div>

      <div class="filters" id="rfilters"></div>
      <ul class="list" id="rlist"></ul>
    </section>
    <section class="card">
      <h2>키워드 대기열</h2>
      <ul class="list" id="queue"></ul>
    </section>
  </div>

  <section class="card">
    <h2>키워드 발굴 결과 <small>최근 결과 · 복사해서 마피아넷·블랙키위·키워드마스터에 붙여넣기</small></h2>
    <div class="filters" id="rtabs"></div>
    <div id="research"></div>
  </section>

  <section class="card">
    <h2>최근 생성 이미지 <small>미리보기 썸네일 · 원본은 images/ 폴더</small></h2>
    <div id="images"></div>
  </section>

  <section class="card">
    <h2>예약 발행 목록</h2>
    <table class="resp" id="sched">
      <thead><tr><th>제목</th><th>예약 일시</th><th class="num">글자 수</th><th class="num">이미지</th><th>검증</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>팀장 재검수 · 루프 로그</h2>
    <ul class="logs" id="logs"></ul>
  </section>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
function tone(s){
  s = String(s||'');
  if (/완료|합격|PASS|예약|추천|승인$/.test(s)) return 'p-ok';
  if (/반려|불합격|FAIL|중단|오류|치열/.test(s)) return 'p-bad';
  if (/보통|적음|승인대기/.test(s)) return 'p-warn';
  if (/중|진행|집필|검수|작업|재검수/.test(s)) return 'p-warn';
  if (/보고/.test(s)) return 'p-acc';
  return 'p-idle';
}
const pill = s => `<span class="pill ${tone(s)}">${esc(s)}</span>`;
const $ = id => document.getElementById(id);

$('updated').textContent = D.updated_at || '-';

const R = D.remodel || [], Q = D.queue || [], S = D.scheduled || [], L = D.logs || [];
const cnt = st => R.filter(p => p.status === st).length;
const done = cnt('완료'), pct = R.length ? Math.round(done / R.length * 100) : 0;

$('kpis').innerHTML = [
  [`${done}/${R.length}`, '리모델링 완료'],
  [Q.filter(q => q.status !== '예약완료').length, '키워드 대기'],
  [S.length, '예약 발행'],
  [L.filter(l => /반려|루프/.test(l.type)).length, '반려·수정 루프'],
].map(([v, k]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');

$('team').innerHTML = (D.team || []).map(m => `
  <div class="card member ${m.id === 'lead' ? 'lead' : ''}">
    <div class="mhead"><span class="mname">${esc(m.name)}</span><span class="model">${esc(m.model)}</span></div>
    <div class="role">${esc(m.role)}</div>
    <div>${pill(m.status || '대기')}</div>
    <div class="report">${m.last_report ? esc(m.last_report) : '<span class="sub">보고 없음</span>'}</div>
    <div class="meta"><span>${esc(m.report_at || '')}</span><span>누적 ${esc(m.count || 0)}건</span></div>
  </div>`).join('');

const ring = $('ring'); ring.style.setProperty('--p', pct); ring.dataset.label = pct + '%';
const segs = [['완료', 'var(--ok)'], ['검수중', 'var(--warn)'], ['미완료', 'var(--idle)']];
$('rlegend').innerHTML = segs.map(([k]) => `<div>${pill(k)} ${cnt(k)}편</div>`).join('') +
  `<div class="bar">${segs.map(([k, c]) => `<i style="width:${R.length ? cnt(k) / R.length * 100 : 0}%;background:${c}"></i>`).join('')}</div>`;

let rf = '전체';
function drawR(){
  $('rfilters').innerHTML = ['전체', ...REM].map(f => `<button class="${f === rf ? 'on' : ''}" data-f="${f}">${f}</button>`).join('');
  const rows = R.filter(p => rf === '전체' || p.status === rf);
  $('rlist').innerHTML = rows.length ? rows.map(p => {
    const u = safeUrl(p.url);
    const t = u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
    return `<li><span class="t">${t}</span>${pill(p.status)}</li>`;
  }).join('') : '<li class="empty">글이 없어요. wp_manager.py sync-remodel 로 동기화하세요.</li>';
}
const REM = ['미완료', '검수중', '완료'];
$('rfilters').addEventListener('click', e => { if (e.target.dataset.f){ rf = e.target.dataset.f; drawR(); } });
drawR();

$('queue').innerHTML = Q.length ? Q.map(q => `<li><span class="t">${esc(q.keyword)}</span>${pill(q.status)}</li>`).join('')
  : '<li class="empty">선택된 키워드가 없어요.</li>';

$('sched').querySelector('tbody').innerHTML = S.length ? S.map(s => {
  const u = safeUrl(s.link);
  return `<tr>
    <td class="c-title">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:inherit">${esc(s.title)}</a>` : esc(s.title)}</td>
    <td>${esc(s.date)}</td>
    <td class="num" data-k="글자">${Number(s.chars || 0).toLocaleString()}자</td>
    <td class="num" data-k="이미지">${esc(s.images)}장</td>
    <td>${pill(s.pass ? 'PASS' : 'FAIL')}</td></tr>`;
}).join('') : '<tr><td colspan="5" class="empty">예약된 글이 없어요.</td></tr>';

// ---- 키워드 발굴 결과
const RS = D.research || [];
let ri = 0;
function copyText(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = '복사됨!'; setTimeout(() => btn.textContent = o, 1500); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(done); return; }
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove(); done();
}
// 체크는 내 PC의 승인 서버(127.0.0.1)로 연 화면에서만 가능 — GitHub/파일 화면은 보기 전용
const canEdit = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let dirty = false;
function vfText(v){
  if (!v) return '';
  if (v.error) return `검증: ${v.error}`;
  const parts = [`월 검색 ${Number(v.total || 0).toLocaleString()}`, `(PC ${Number(v.pc || 0).toLocaleString()} · 모바일 ${Number(v.mobile || 0).toLocaleString()})`];
  if (v.docs != null) parts.push(`문서 ${Number(v.docs).toLocaleString()}`);
  if (v.comp) parts.push(`광고경쟁 ${v.comp}`);
  return parts.join(' ');
}
function drawResearch(){
  if (!RS.length){ $('research').innerHTML = '<div class="empty">아직 발굴 결과가 없어요.</div>'; return; }
  $('rtabs').innerHTML = RS.slice(0, 8).map((r, i) =>
    `<button class="${i === ri ? 'on' : ''}" data-i="${i}">${esc(r.kind)} · ${esc(r.seed)}${r.status === '승인대기' ? ' ●' : ''}</button>`).join('');
  const r = RS[ri], kws = r.keywords || [];
  const isDisc = r.kind === '발굴';
  const nApproved = kws.filter(k => k.approved).length;
  let note = '';
  if (isDisc && r.status === '승인대기')
    note = canEdit ? `<div class="notice">승인할 키워드를 체크하고 <b>승인 저장</b>을 눌러 주세요. 저장 전에는 새 키워드 발굴이 멈춰 있어요.</div>`
                   : `<div class="notice">승인 대기 중 · 체크는 PC에서 <b>open_dashboard.bat</b>으로 연 화면에서 할 수 있어요.</div>`;
  else if (isDisc) note = `<div class="notice info">검토 완료 (${esc(r.reviewed_at || '')}) · 승인 ${nApproved}개 → 검증관이 검색량을 확인해요.</div>`;
  $('research').innerHTML = `
    <div class="rmeta"><span>${esc(r.time)}</span><span>${kws.length}개</span>${isDisc ? pill(r.status) : ''}<span>파일: ${esc(r.file)}</span>
      <button id="copykw">${isDisc && nApproved ? '승인 키워드 복사' : '키워드 전체 복사'}</button>
      ${isDisc && canEdit ? `<button id="selall">전체 선택/해제</button><button id="saveap" class="primary">승인 저장</button>` : ''}</div>
    ${note}
    <div class="kwgrid">${kws.map((k, j) => `<div class="kw ${k.approved ? 'ap' : ''}">
        <label class="kl">${isDisc ? `<input type="checkbox" data-j="${j}" ${k.approved ? 'checked' : ''} ${canEdit ? '' : 'disabled'}>` : ''}
          <span>${esc(k.keyword)}<span class="vf">${esc(vfText(k.verify))}</span></span></label>
        ${k.verify && k.verify.grade ? pill(k.verify.grade) : (k.tag ? pill(k.tag).replace(/p-(ok|bad|warn|idle)/, 'p-acc') : '')}</div>`).join('')}</div>`;
  const boxes = () => [...$('research').querySelectorAll('input[type=checkbox]')];
  $('copykw').onclick = e => copyText((isDisc && nApproved ? kws.filter(k => k.approved) : kws).map(k => k.keyword).join('\n'), e.target);
  if (isDisc && canEdit){
    $('research').addEventListener('change', () => { dirty = true; });
    $('selall').onclick = () => { const b = boxes(), all = b.every(x => x.checked); b.forEach(x => x.checked = !all); dirty = true; };
    $('saveap').onclick = async e => {
      const approved = boxes().filter(x => x.checked).map(x => kws[+x.dataset.j].keyword);
      if (!approved.length && !confirm('체크한 키워드가 없어요. 이대로 검토 완료(모두 미승인) 처리할까요?')) return;
      e.target.disabled = true; e.target.textContent = '저장 중…';
      try {
        const res = await fetch('/api/approve', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                 body: JSON.stringify({id: r.id, approved})}).then(x => x.json());
        if (!res.ok) throw new Error(res.error || '저장 실패');
        dirty = false; e.target.textContent = `저장됨 (${res.approved}개)`;
        setTimeout(() => location.replace('/?t=' + Date.now()), 1200);
      } catch (err) { alert('저장 실패: ' + err.message); e.target.disabled = false; e.target.textContent = '승인 저장'; }
    };
  }
}
$('rtabs').addEventListener('click', e => { if (e.target.dataset.i){ ri = +e.target.dataset.i; drawResearch(); } });
drawResearch();

// ---- 최근 생성 이미지
const IM = D.images || [];
const imgBase = location.pathname.replace(/\\/g, '/').includes('/docs/') ? '../' : '';
$('images').innerHTML = IM.length ? IM.map(g => `
  <div class="rmeta"><b style="color:var(--ink)">${esc(g.topic)}</b><span>${esc(g.time)} · ${g.items.length}장</span></div>
  <div class="gallery">${g.items.map(i => `<figure><img loading="lazy" src="${esc(i.thumb || (imgBase + i.file))}" alt="${esc(i.alt)}"
     onerror="this.style.display='none'"><figcaption>alt: ${esc(i.alt)}</figcaption></figure>`).join('')}</div>`).join('')
  : '<div class="empty">아직 생성된 이미지가 없어요.</div>';

// ---- 실시간 갱신 (30초마다, 화면을 보고 있을 때만)
// PC(파일): 다시 불러오기 / 스마트폰(GitHub Pages): 캐시를 피해 새 데이터가 있을 때만 갱신
const online = /^https?:$/.test(location.protocol);
let left = 30;
async function checkNew(){
  try {
    const r = await fetch(location.pathname + '?t=' + Date.now(), {cache: 'no-store'});
    const t = await r.text();
    const m = t.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
    if (m && JSON.parse(m[1]).updated_at !== D.updated_at) location.replace(location.pathname + '?t=' + Date.now());
  } catch (e) {}
}
setInterval(() => {
  if (document.hidden) return;
  if (dirty){ $('live').textContent = '체크 저장 전 · 자동 갱신 멈춤'; return; }
  left -= 1;
  $('live').textContent = `실시간 확인 ${left}초`;
  if (left <= 0){ left = 30; online ? checkNew() : location.reload(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && online) checkNew(); });

$('logs').innerHTML = L.length ? L.map(l => `
  <li><span class="when">${esc(l.time)} · ${esc(l.actor)}${l.loop ? ` · 루프 ${esc(l.loop)}/3` : ''}</span>
  <span>${pill(l.type)}</span><span>${esc(l.message)}</span></li>`).join('')
  : '<li class="empty">로그가 없어요.</li>';
</script>
</body>
</html>
