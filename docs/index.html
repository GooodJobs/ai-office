<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>k-keyword AI 오피스</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
  --accent:#3b5bdb; --accent-soft:#e7ecff;
  --ok:#1f8a4c; --ok-soft:#e3f5ea; --warn:#b26a00; --warn-soft:#fff3df; --bad:#c0362c; --bad-soft:#fde8e6;
  --idle:#667085; --idle-soft:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --card:#171b21; --ink:#e7eaee; --muted:#98a2b3; --line:#2a3039;
    --accent:#8ea2ff; --accent-soft:#1f2747;
    --ok:#5cc98a; --ok-soft:#14301f; --warn:#f0b357; --warn-soft:#33270f; --bad:#f2837a; --bad-soft:#3a1916;
    --idle:#98a2b3; --idle-soft:#232831; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:7px 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
section{margin-bottom:18px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.member{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.member.lead{border-color:var(--accent);background:linear-gradient(0deg,var(--card),var(--card)),var(--accent-soft)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mname{font-weight:700}
.model{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.role{font-size:12.5px;color:var(--muted)}
.report{font-size:13px;background:var(--bg);border-radius:8px;padding:8px;min-height:44px;word-break:break-word}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--idle)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{padding:16px}
.gauge{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.ring{--p:0;width:108px;height:108px;border-radius:50%;flex:none;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--idle-soft) 0);display:grid;place-items:center}
.ring::after{content:attr(data-label);width:80px;height:80px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--idle-soft);overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.list{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:13.5px}
.list li:first-child{border-top:0}
.list .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list a{color:inherit;text-decoration:none} .list a:hover{text-decoration:underline}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12.5px;border-top:0}
td.num{font-variant-numeric:tabular-nums;text-align:right} th.num{text-align:right}
.logs{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.logs li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 2px;border-top:1px solid var(--line);font-size:13.5px}
.logs li:first-child{border-top:0}
.logs .when{grid-column:1/-1;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:14px 2px}
@media (max-width:1000px){.team{grid-template-columns:repeat(2,1fr)} .member.lead{grid-column:1/-1}}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
  table.resp td{border:0;padding:0;text-align:left}
  table.resp td.c-title{grid-column:1/-1;font-weight:600}
  table.resp td.num{text-align:left;color:var(--muted);font-size:12.5px}
  table.resp td.num::before{content:attr(data-k) " "}
}
@media (max-width:420px){.team{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>k-keyword AI 오피스</h1>

  <section>

        <div class="legend" id="rlegend"></div>

    <section class="card">
      <h2>키워드 대기열</h2>
      <ul class="list" id="queue"></ul>
    </section>
  </div>

  <section class="card">
    <h2>예약 발행 목록</h2>

      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>팀장 재검수 · 루프 로그</h2>
    <ul class="logs" id="logs"></ul>
  </section>
</div>

  if (/중|진행|집필|검수|작업|재검수/.test(s)) return 'p-warn';
  if (/보고/.test(s)) return 'p-acc';
  return 'p-idle';
}
const pill = s => `<span class="pill ${tone(s)}">${esc(s)}</span>`;
const $ = id => document.getElementById(id);

$('updated').textContent = D.updated_at || '-';

const R = D.remodel || [], Q = D.queue || [], S = D.scheduled || [], L = D.logs || [];
const cnt = st => R.filter(p => p.status === st).length;
const done = cnt('완료'), pct = R.length ? Math.round(done / R.length * 100) : 0;

$('kpis').innerHTML = [
  [`${done}/${R.length}`, '리모델링 완료'],
  [Q.filter(q => q.status !== '예약완료').length, '키워드 대기'],
  [S.length, '예약 발행'],
  [L.filter(l => /반려|루프/.test(l.type)).length, '반려·수정 루프'],
].map(([v, k]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');

$('team').innerHTML = (D.team || []).map(m => `
  <div class="card member ${m.id === 'lead' ? 'lead' : ''}">
    <div class="mhead"><span class="mname">${esc(m.name)}</span><span class="model">${esc(m.model)}</span></div>
    <div class="role">${esc(m.role)}</div>
    <div>${pill(m.status || '대기')}</div>
    <div class="report">${m.last_report ? esc(m.last_report) : '<span class="sub">보고 없음</span>'}</div>
    <div class="meta"><span>${esc(m.report_at || '')}</span><span>누적 ${esc(m.count || 0)}건</span></div>
  </div>`).join('');

const ring = $('ring'); ring.style.setProperty('--p', pct); ring.dataset.label = pct + '%';
const segs = [['완료', 'var(--ok)'], ['검수중', 'var(--warn)'], ['미완료', 'var(--idle)']];
$('rlegend').innerHTML = segs.map(([k]) => `<div>${pill(k)} ${cnt(k)}편</div>`).join('') +
  `<div class="bar">${segs.map(([k, c]) => `<i style="width:${R.length ? cnt(k) / R.length * 100 : 0}%;background:${c}"></i>`).join('')}</div>`;

let rf = '전체';
function drawR(){
  $('rfilters').innerHTML = ['전체', ...REM].map(f => `<button class="${f === rf ? 'on' : ''}" data-f="${f}">${f}</button>`).join('');
  const rows = R.filter(p => rf === '전체' || p.status === rf);
  $('rlist').innerHTML = rows.length ? rows.map(p => {
    const u = safeUrl(p.url);
    const t = u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
    return `<li><span class="t">${t}</span>${pill(p.status)}</li>`;
  }).join('') : '<li class="empty">글이 없어요. wp_manager.py sync-remodel 로 동기화하세요.</li>';
}
const REM = ['미완료', '검수중', '완료'];
$('rfilters').addEventListener('click', e => { if (e.target.dataset.f){ rf = e.target.dataset.f; drawR(); } });
drawR();

$('queue').innerHTML = Q.length ? Q.map(q => `<li><span class="t">${esc(q.keyword)}</span>${pill(q.status)}</li>`).join('')
  : '<li class="empty">선택된 키워드가 없어요.</li>';

$('sched').querySelector('tbody').innerHTML = S.length ? S.map(s => {
  const u = safeUrl(s.link);
  return `<tr>
    <td class="c-title">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:inherit">${esc(s.title)}</a>` : esc(s.title)}</td>
    <td>${esc(s.date)}</td>
    <td class="num" data-k="글자">${Number(s.chars || 0).toLocaleString()}자</td>
    <td class="num" data-k="이미지">${esc(s.images)}장</td>
    <td>${pill(s.pass ? 'PASS' : 'FAIL')}</td></tr>`;
}).join('') : '<tr><td colspan="5" class="empty">예약된 글이 없어요.</td></tr>';

$('logs').innerHTML = L.length ? L.map(l => `
  <li><span class="when">${esc(l.time)} · ${esc(l.actor)}${l.loop ? ` · 루프 ${esc(l.loop)}/3` : ''}</span>
  <span>${pill(l.type)}</span><span>${esc(l.message)}</span></li>`).join('')
  : '<li class="empty">로그가 없어요.</li>';
</script>
</body>
</html>
